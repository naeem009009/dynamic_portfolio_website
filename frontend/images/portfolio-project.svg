<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#grad1)" rx="15"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.1)"/>
  <circle cx="350" cy="200" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="320" cy="60" r="20" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Project icon -->
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="100" height="80" fill="rgba(255,255,255,0.2)" rx="8"/>
    <rect x="10" y="10" width="80" height="5" fill="rgba(255,255,255,0.4)" rx="2"/>
    <rect x="10" y="25" width="60" height="5" fill="rgba(255,255,255,0.3)" rx="2"/>
    <rect x="10" y="40" width="70" height="5" fill="rgba(255,255,255,0.3)" rx="2"/>
    <rect x="10" y="55" width="50" height="5" fill="rgba(255,255,255,0.3)" rx="2"/>
  </g>
  
  <!-- Project name text -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Portfolio</text>
  
  <!-- Subtitle -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Personal Website Project</text>
</svg>
