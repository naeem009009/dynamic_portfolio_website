<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#cryptoGrad)" rx="15"/>
  
  <!-- Geometric pattern with dots and lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="30" x2="350" y2="30"/>
    <line x1="50" y1="220" x2="350" y2="220"/>
    <line x1="50" y1="30" x2="50" y2="220"/>
    <line x1="350" y1="30" x2="350" y2="220"/>
  </g>
  
  <!-- Glowing dots -->
  <circle cx="80" cy="50" r="2" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="320" cy="60" r="2" fill="#ff9500" opacity="0.6" filter="url(#glow)"/>
  <circle cx="100" cy="200" r="2" fill="#764ba2" opacity="0.6" filter="url(#glow)"/>
  <circle cx="300" cy="190" r="2" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="60" cy="120" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="130" r="1.5" fill="#fff" opacity="0.4"/>
  
  <!-- Main app icon container -->
  <rect x="125" y="35" width="150" height="150" fill="url(#iconGrad)" rx="20" filter="url(#glow)"/>
  
  <!-- Bitcoin logo -->
  <g transform="translate(200, 95)">
    <circle cx="0" cy="0" r="25" fill="#f7931a"/>
    <text x="0" y="8" font-family="Arial" font-size="28" fill="white" text-anchor="middle" font-weight="bold">₿</text>
  </g>
  
  <!-- Intertwined arrows -->
  <!-- Up arrow (blue) -->
  <g transform="translate(160, 85)" filter="url(#glow)">
    <polygon points="0,-15 -8,0 -3,0 -3,15 3,15 3,0 8,0" fill="url(#blueGrad)"/>
  </g>
  
  <!-- Down arrow (orange) -->
  <g transform="translate(240, 105)" filter="url(#glow)">
    <polygon points="0,15 -8,0 -3,0 -3,-15 3,-15 3,0 8,0" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- MINI DEX text -->
  <text x="200" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MINI DEX</text>
  
  <!-- CRYPTO EXCHANGE text -->
  <text x="200" y="168" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">CRYPTO EXCHANGE</text>
  
  <!-- Project title below icon -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Crypto Exchange Mini App</text>
</svg>
